<style>
  :root{--brand:#4F3A82;--brand-d:#2C1E4A;--brand-l:#8B5CF6;--paper:#F6F3F8;--ink:#241A33}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    background:var(--paper);color:var(--ink);display:flex;flex-direction:column}
  .bar{flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:0 18px;height:54px;
    background:var(--brand-d);color:#EFE9F7}
  .mark{display:flex;align-items:center;gap:9px;flex:0 0 auto;
    font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;font-size:15px;letter-spacing:.02em}
  .mark svg{width:22px;height:22px;flex:0 0 auto}
  .tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden}
  .tabs button{background:none;border:0;height:54px;padding:0 14px;cursor:pointer;
    font-family:inherit;font-size:13px;color:#A797C2;white-space:nowrap;border-bottom:2px solid transparent}
  .tabs button:hover{color:#EFE9F7}
  .tabs button.on{color:#fff;border-bottom-color:var(--brand-l)}
  .tabs button:focus-visible{outline:2px solid var(--brand-l);outline-offset:-4px}
  .note{flex:0 0 auto;font-size:11px;color:#8F7DB3;letter-spacing:.02em}
  main{flex:1;min-height:0;position:relative;background:var(--paper)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper)}
  iframe[hidden]{display:none}
  .boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#8F7DB3;letter-spacing:.04em}
  @media (max-width:640px){
    .bar{gap:10px;padding:0 10px}
    .tabs button{padding:0 10px;font-size:12.5px}
    .note{display:none}
  }
</style>
</head>

<script>
(function () {
  'use strict';
  var KEYS = ['stu', 'ent', 'sch', 'entry'];
  var FONTS = document.getElementById('fonts-css').textContent;

  function decode(b64) {
    var bin = atob(b64.replace(/\s+/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function mount(k) {
    var frame = document.getElementById('f-' + k);
    if (!frame || frame.getAttribute('data-mounted') === '1') return;
    var holder = document.getElementById('doc-' + k);
    var html = decode(holder.textContent).replace('<!--FONTS-->', '<style>' + FONTS + '</style>');
    frame.setAttribute('data-mounted', '1');
    frame.srcdoc = html;
  }

  function activate(k, push) {
    if (KEYS.indexOf(k) < 0) k = 'stu';
    mount(k);
    KEYS.forEach(function (x) {
      var f = document.getElementById('f-' + x);
      if (f) f.hidden = (x !== k);
    });
    var boot = document.getElementById('boot');
    if (boot) boot.style.display = 'none';
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
      var on = b.getAttribute('data-k') === k;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    if (push !== false && ('#' + k) !== location.hash) history.replaceState(null, '', '#' + k);
  }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('button[data-k]') : null;
    if (btn) activate(btn.getAttribute('data-k'));
  });

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d !== 'string' || d.indexOf('opc:') !== 0) return;
    var k = d.slice(4);
    activate(k === 'switch' ? 'entry' : k);
  });

  window.addEventListener('hashchange', function () {
    activate(location.hash.replace('#', ''), false);
  });

  /* 首屏先把字体塞进主文档，避免 iframe 里再次解析 300KB 字体 */
  var st = document.createElement('style');
  st.textContent = FONTS;
  document.head.appendChild(st);

  activate(location.hash.replace('#', '') || 'stu', false);
})();
</script>
